name: goreleaser

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'

      - name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@v6
        id: import_gpg
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.PASSPHRASE || '' }}
          fingerprint: ${{ secrets.GPG_FINGERPRINT }}

      - name: Verify and trust GPG key
        run: |
          echo "=== GPG Key Verification ==="
          gpg --list-secret-keys --keyid-format LONG
          FINGERPRINT="${{ steps.import_gpg.outputs.fingerprint }}"
          SECRET_FINGERPRINT="${{ secrets.GPG_FINGERPRINT }}"
          echo "Expected fingerprint: $SECRET_FINGERPRINT"
          echo "Imported fingerprint: $FINGERPRINT"
          
          # Use imported fingerprint or fall back to secret
          USE_FINGERPRINT="${FINGERPRINT:-$SECRET_FINGERPRINT}"
          echo "Using fingerprint: $USE_FINGERPRINT"
          
          if [ -z "$USE_FINGERPRINT" ]; then
            echo "ERROR: No fingerprint available!"
            exit 1
          fi
          
          # Export public key to ensure it's in the keyring
          echo "Exporting public key..."
          gpg --armor --export "$USE_FINGERPRINT" | gpg --import || true
          
          # Trust the GPG key (ultimate trust)
          echo "Trusting key..."
          echo -e "5\ny\n" | gpg --batch --command-fd 0 --edit-key "$USE_FINGERPRINT" trust || true
          
          # Set as default key in GPG config
          echo "Setting as default key in gpg.conf..."
          mkdir -p ~/.gnupg
          echo "default-key $USE_FINGERPRINT" >> ~/.gnupg/gpg.conf
          cat ~/.gnupg/gpg.conf | grep default-key || echo "WARNING: default-key not found in config"
          
          # Verify key is available
          echo "Verifying key availability..."
          gpg --list-keys "$USE_FINGERPRINT" || (echo "ERROR: Key not found!" && exit 1)
          
          # Test signing exactly as GoReleaser would
          echo "Testing GPG signing (GoReleaser style)..."
          echo "test content" > /tmp/test_checksum.txt
          gpg --batch --pinentry-mode=loopback --armor --detach-sign /tmp/test_checksum.txt
          if [ -f /tmp/test_checksum.txt.asc ]; then
            echo "✓ Signing test successful - signature file created"
            cat /tmp/test_checksum.txt.asc | head -5
          else
            echo "✗ Signing test failed - no signature file"
            exit 1
          fi
          
          echo "FINGERPRINT=$USE_FINGERPRINT" >> $GITHUB_ENV
          echo "✓ GPG key setup complete"

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPG_FINGERPRINT: ${{ env.FINGERPRINT }}

