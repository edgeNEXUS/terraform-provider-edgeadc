name: goreleaser

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'

      - name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@v6
        id: import_gpg
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.PASSPHRASE }}
          fingerprint: ${{ secrets.GPG_FINGERPRINT }}

      - name: Verify GPG key
        run: |
          gpg --list-secret-keys --keyid-format LONG
          echo "Expected fingerprint: ${{ secrets.GPG_FINGERPRINT }}"
          FINGERPRINT="${{ steps.import_gpg.outputs.fingerprint }}"
          echo "Imported fingerprint: $FINGERPRINT"
          # Trust the GPG key (ultimate trust)
          if [ -n "$FINGERPRINT" ]; then
            echo -e "5\ny\n" | gpg --batch --command-fd 0 --edit-key "$FINGERPRINT" trust || true
          fi

      - name: Set GPG fingerprint
        id: set_fingerprint
        run: |
          FINGERPRINT="${{ steps.import_gpg.outputs.fingerprint }}"
          if [ -z "$FINGERPRINT" ]; then
            FINGERPRINT="${{ secrets.GPG_FINGERPRINT }}"
          fi
          echo "fingerprint=$FINGERPRINT" >> $GITHUB_OUTPUT
          echo "Using fingerprint: $FINGERPRINT"

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPG_FINGERPRINT: ${{ steps.set_fingerprint.outputs.fingerprint }}

