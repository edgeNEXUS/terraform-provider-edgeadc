name: goreleaser

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'

      - name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@v6
        id: import_gpg
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.PASSPHRASE || '' }}
          fingerprint: ${{ secrets.GPG_FINGERPRINT }}

      - name: Verify and trust GPG key
        run: |
          echo "=== GPG Key Verification ==="
          gpg --list-secret-keys --keyid-format LONG
          FINGERPRINT="${{ steps.import_gpg.outputs.fingerprint }}"
          SECRET_FINGERPRINT="${{ secrets.GPG_FINGERPRINT }}"
          echo "Expected fingerprint: $SECRET_FINGERPRINT"
          echo "Imported fingerprint: $FINGERPRINT"
          
          # Use imported fingerprint or fall back to secret
          USE_FINGERPRINT="${FINGERPRINT:-$SECRET_FINGERPRINT}"
          echo "Using fingerprint: $USE_FINGERPRINT"
          
          if [ -z "$USE_FINGERPRINT" ]; then
            echo "ERROR: No fingerprint available!"
            exit 1
          fi
          
          # Trust the GPG key (ultimate trust)
          echo -e "5\ny\n" | gpg --batch --command-fd 0 --edit-key "$USE_FINGERPRINT" trust || true
          
          # Set as default key in GPG config
          echo "Setting as default key..."
          mkdir -p ~/.gnupg
          echo "default-key $USE_FINGERPRINT" >> ~/.gnupg/gpg.conf
          
          # Verify key is available and can sign
          echo "Testing key availability..."
          gpg --list-keys "$USE_FINGERPRINT" || echo "WARNING: Key not found in public keyring"
          
          # Test signing a dummy file
          echo "Testing GPG signing..."
          echo "test" > /tmp/test.txt
          gpg --batch --pinentry-mode=loopback --armor --detach-sign /tmp/test.txt && echo "✓ Signing test successful" || echo "✗ Signing test failed"
          ls -la /tmp/test.txt* || true
          
          echo "FINGERPRINT=$USE_FINGERPRINT" >> $GITHUB_ENV

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPG_FINGERPRINT: ${{ env.FINGERPRINT || steps.import_gpg.outputs.fingerprint || secrets.GPG_FINGERPRINT }}

