name: Release Provider Binaries

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag name to release (e.g., v0.1.8)'
        required: true

jobs:
  build:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            ext: ""
            pack: tar.gz
          - goos: linux
            goarch: arm64
            ext: ""
            pack: tar.gz
          - goos: darwin
            goarch: amd64
            ext: ""
            pack: tar.gz
          - goos: darwin
            goarch: arm64
            ext: ""
            pack: tar.gz
          - goos: windows
            goarch: amd64
            ext: ".exe"
            pack: zip

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
          INPUT_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || '' }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          APP=terraform-provider-edgeadc
          OUT=dist
          mkdir -p "$OUT"
          go mod download
          go build -ldflags "-s -w" -o "$OUT/${APP}${{ matrix.ext }}" .
          cd "$OUT"
          VER="${INPUT_TAG:-$REF_NAME}"
          PKG="${APP}_${VER}_${{ matrix.goos }}_${{ matrix.goarch }}"
          if [ "${{ matrix.pack }}" = "zip" ]; then
            zip -q "${PKG}.zip" "${APP}${{ matrix.ext }}"
            rm -f "${APP}${{ matrix.ext }}"
          else
            tar -czf "${PKG}.tar.gz" "${APP}${{ matrix.ext }}"
            rm -f "${APP}${{ matrix.ext }}"
          fi
          # create per-arch checksum
          sha256sum * > "SHA256SUMS_${{ matrix.goos }}_${{ matrix.goarch }}"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifact-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*

  release:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: artifact-*
          merge-multiple: true
          path: release

      - name: List release artifacts
        run: |
          ls -alh release

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

# Terraform Provider release workflow.
name: Release

# This GitHub action creates a release when a tag that matches the pattern
# "v*" (e.g. v0.1.0) is created.
on:
  push:
    tags:
      - 'v*'

# Releases need permissions to read and write the repository contents.
# GitHub considers creating releases and uploading assets as writing contents.
permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d632683dd7b4114ad314bca15554477dd762a938 # v4.2.0
        with:
          # Allow goreleaser to access older tag information.
          fetch-depth: 0
      - uses: actions/setup-go@3041bf56c941b39c61721a86cd11f3bb1338122a # v5.2.0
        with:
          go-version-file: 'go.mod'
          cache: true
      - name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@01dd5d3ca463c7f10f7f4f7b4f177225ac661ee4 # v6.1.0
        id: import_gpg
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.PASSPHRASE }}
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@9ed2f89a662bf1735a48bc8557fd212fa902bebf # v6.1.0
        with:
          args: release --clean
        env:
          # GitHub sets the GITHUB_TOKEN secret automatically.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}
