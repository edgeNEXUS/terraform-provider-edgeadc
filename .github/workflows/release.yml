name: Release Provider Binaries

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag name to release (e.g., v0.1.8)'
        required: true

jobs:
  build:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            ext: ""
            pack: tar.gz
          - goos: linux
            goarch: arm64
            ext: ""
            pack: tar.gz
          - goos: darwin
            goarch: amd64
            ext: ""
            pack: tar.gz
          - goos: darwin
            goarch: arm64
            ext: ""
            pack: tar.gz
          - goos: windows
            goarch: amd64
            ext: ".exe"
            pack: zip

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
          INPUT_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || '' }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          APP=terraform-provider-edgeadc
          OUT=dist
          mkdir -p "$OUT"
          go mod download
          go build -ldflags "-s -w" -o "$OUT/${APP}${{ matrix.ext }}" .
          cd "$OUT"
          VER="${INPUT_TAG:-$REF_NAME}"
          PKG="${APP}_${VER}_${{ matrix.goos }}_${{ matrix.goarch }}"
          if [ "${{ matrix.pack }}" = "zip" ]; then
            zip -q "${PKG}.zip" "${APP}${{ matrix.ext }}"
            rm -f "${APP}${{ matrix.ext }}"
          else
            tar -czf "${PKG}.tar.gz" "${APP}${{ matrix.ext }}"
            rm -f "${APP}${{ matrix.ext }}"
          fi
          # create per-arch checksum
          sha256sum * > "SHA256SUMS_${{ matrix.goos }}_${{ matrix.goarch }}"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifact-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*

  release:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: artifact-*
          merge-multiple: true
          path: release

      - name: List release artifacts
        run: |
          ls -alh release

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
